<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="google-adsense-account" content="ca-pub-4643816814965648">
    <title>Search — BenchmarkResult - HF Plays</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="assets/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/css/all.min.css">
    <style>
        .section-heading h2 {
            margin: 0 !important;
            white-space: nowrap !important;
            font-size: 1.25rem;
        }

        @media (max-width: 768px) {
            .anim-title {
                text-align: center;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                width: 100%;
            }

            .anim-title h1 {
                text-align: center;
                width: 100%;
            }
        }
    </style>
    <script>
        (function () {
            const savedTheme = localStorage.getItem('hf_theme') || localStorage.getItem('hfplays_theme');
            const sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = savedTheme || (sysDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
            document.documentElement.setAttribute('data-bs-theme', theme);

            const isMobile = window.innerWidth <= 780 || window.matchMedia('(max-width: 780px)').matches || window.matchMedia('(pointer: coarse)').matches;
            let savedView = localStorage.getItem('hf_view_mode') || localStorage.getItem('hfplays_view');
            if (!savedView) {
                savedView = isMobile ? 'lite' : 'normal';
            }
            document.documentElement.setAttribute('data-view', savedView);
        })();
    </script>
    <script src="assets/data/db-core.js"></script>
    <script src="assets/data/db-partners.js"></script>
    <script src="assets/device-core.js"></script>
    <script src="assets/device-partners.js"></script>
    <script src="assets/app.js"></script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4643816814965648"
     crossorigin="anonymous"></script>
</head>

<body>
    <nav class="nav">
        <div class="container nav-inner">
            <a class="brand" href="index.html">Benchmark<span>Result</span> - HF Plays</a>

            <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" type="button">
                <i class="fa-solid fa-bars"></i>
            </button>

            <div class="links" id="navLinks">
                <a href="index.html">Home</a>
                <div class="nav-dropdown">
                    <button class="nav-dropdown-toggle" type="button" aria-expanded="false">Mobile <i
                            class="fa-solid fa-chevron-down"></i></button>
                    <div class="nav-dropdown-menu" data-dropdown-menu="device"></div>
                </div>
                <div class="nav-dropdown">
                    <button class="nav-dropdown-toggle" type="button" aria-expanded="false">Desktop <i
                            class="fa-solid fa-chevron-down"></i></button>
                    <div class="nav-dropdown-menu" data-dropdown-menu="desktop"></div>
                </div>
                <a href="contacts.html">Contacts</a>
                <a href="search.html" aria-label="Search" title="Search" class="active nav-search-btn">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </a>

                <button class="view-toggle-btn" id="viewToggle" aria-label="Toggle Lite View"
                    title="Switch to Lite Performance Mode" type="button">
                    <i class="fa-solid fa-feather-pointed"></i>
                </button>

                <button class="theme-toggle-btn" id="themeToggle" aria-label="Toggle Theme" title="Toggle Theme"
                    type="button">
                    <i class="fa-solid fa-sun"></i>
                </button>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="eyebrow anim-title">
            <h1>Search</h1>
        </div>
        <section class="section">
            <div class="section-heading">
                <div style="display: flex; align-items: baseline; gap: 10px;">
                    <h2>Game list</h2>
                    <span id="searchGameCount" class="platform-badge"
                        style="font-size: 0.8rem; padding: 2px 8px; border-radius: 999px; transform: translateY(1px);">0
                        games tested</span>
                </div>
                <div class="device-controls-wrap">
                    <div class="search-box" style="margin-bottom: 0;">
                        <input type="text" id="deviceGameSearch" placeholder="Search by title or platform..."
                            style="padding:.55rem 1rem;font-size:.88rem;width:180px;">
                    </div>
                    <div class="game-sort" aria-label="Sort games">
                        <span>Sort</span>
                        <button type="button" class="is-active" data-search-sort="latest" title="Sort by Latest"
                            aria-label="Sort by latest">
                            <i class="fa-solid fa-clock"></i>
                        </button>
                        <button type="button" data-search-sort="alphabetical" title="Alphabetical"
                            aria-label="Sort alphabetically">
                            <i class="fa-solid fa-arrow-down-a-z"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Wadah hasil pencarian global yang menampilkan semua game beserta nama platform perangkatnya -->
            <div class="discovery-grid" id="resultsContainer"></div>
        </section>
    </main>

    <footer class="footer">
        <div class="container"></div>
    </footer>
</body>

</html>
