            const theme = savedTheme || (sysDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
            document.documentElement.setAttribute('data-bs-theme', theme);

            // Deteksi Mobile
            const isMobile = window.innerWidth <= 780 || window.matchMedia('(max-width: 780px)').matches || window.matchMedia('(pointer: coarse)').matches;

            // Ambil data view
            let savedView = localStorage.getItem('hf_view_mode') || localStorage.getItem('hfplays_view');

            // Jika belum ada pilihan tersimpan, default ke 'lite' untuk mobile
            if (!savedView) {
                savedView = isMobile ? 'lite' : 'normal';
            }

            document.documentElement.setAttribute('data-view', savedView);
        })();
    </script>
